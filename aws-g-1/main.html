<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Girls-1 Login</title>

    <link rel="preload" href="1026.mp4"    as="video" type="video/mp4">
    <link rel="preload" href="correct.mp4" as="video" type="video/mp4">
    <link rel="preload" href="wrong.mp4"   as="video" type="video/mp4">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>

    <style>
        :root {
            --bg:        #FBEFF2;   /* pale blush */
            --panel:     #FFFFFF;
            --cream:     #FFF7F3;
            --surface:   #FDF1F0;
            --line:      #F1D9DE;
            --ink:       #4A2C38;   /* deep plum */
            --ink-soft:  #93707C;
            --ink-faint: #C29FAB;
            --rose:      #E5799A;   /* rose */
            --rose-deep: #D25D82;
            --gold:      #E0A96D;   /* soft rose-gold */
            --ok:        #3FA88B;
            --err:       #D9506E;
            --warn:      #D99A3C;
            --radius:    22px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
            position: relative;
        }

        /* Soft romantic backdrop */
        .backdrop {
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(800px 620px at 15% 0%, rgba(229,121,154,0.28), transparent 60%),
                radial-gradient(760px 620px at 100% 100%, rgba(224,169,109,0.24), transparent 58%),
                linear-gradient(160deg, #FCEFF3 0%, #F7E4EC 100%);
        }
        /* Floating petals */
        .petal {
            position: fixed; z-index: 0; pointer-events: none;
            width: 26px; height: 26px; opacity: 0.55;
            background: radial-gradient(circle at 30% 30%, #F7B7CB, #E5799A);
            border-radius: 60% 10% 60% 10%;
            will-change: transform;
        }

        .login-container {
            position: relative; z-index: 2;
            display: flex;
            width: 900px;
            height: 580px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 30px 80px rgba(196,110,140,0.28);
            overflow: hidden;
            opacity: 0;
        }

        /* Video panel */
        .image-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #F3D9E1;
        }
        .image-panel video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.6s ease;
        }
        .panel-veil {
            position: absolute; inset: 0; z-index: 2; pointer-events: none;
            background:
                linear-gradient(180deg, rgba(210,93,130,0.05) 0%, transparent 40%, rgba(74,44,56,0.5) 100%),
                linear-gradient(120deg, rgba(229,121,154,0.15), transparent 55%);
        }
        .panel-caption {
            position: absolute; z-index: 3; left: 32px; right: 32px; bottom: 32px;
            pointer-events: none;
        }
        .panel-caption p {
            font-family: 'Fraunces', serif; font-weight: 600; font-style: italic;
            font-size: 1.35em; line-height: 1.35; color: #fff;
            text-shadow: 0 2px 16px rgba(120,50,75,0.5);
        }

        /* Auth panel */
        .login-panel {
            flex: 1;
            padding: 0 48px;
            display: flex; flex-direction: column; justify-content: center;
            background: linear-gradient(180deg, #FFFFFF 0%, var(--cream) 100%);
            position: relative;
        }
        .flourish {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 16px; color: var(--rose);
        }
        .flourish .line { height: 1px; width: 32px; background: linear-gradient(90deg, transparent, var(--rose)); }
        .flourish .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(224,169,109,0.18); }
        .flourish span { font-family: 'Fraunces', serif; font-size: 0.78em; letter-spacing: 3px; text-transform: uppercase; }

        .login-panel h2 {
            font-family: 'Fraunces', serif; font-weight: 700;
            font-size: 2.1em; letter-spacing: -0.3px; margin-bottom: 8px; color: var(--ink);
        }
        .subtitle { color: var(--ink-soft); margin-bottom: 30px; font-size: 0.93em; }

        .form-body { display: flex; flex-direction: column; }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; margin-bottom: 8px;
            color: var(--ink-soft); font-weight: 500; font-size: 0.82em; letter-spacing: 0.2px;
        }
        .input-shell {
            border-radius: 14px;
            background: var(--surface);
            border: 1.5px solid var(--line);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-shell.focused {
            border-color: var(--rose);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(229,121,154,0.16);
        }
        .input-group input {
            width: 100%; padding: 13px 16px;
            border: none; background: transparent;
            font-size: 0.96em; color: var(--ink);
            font-family: inherit; border-radius: 14px;
        }
        .input-group input:focus { outline: none; }
        .input-group input::placeholder { color: var(--ink-faint); }

        .btn {
            position: relative; overflow: hidden;
            width: 100%; margin-top: 8px; padding: 15px;
            background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 55%, var(--gold) 130%);
            color: #fff; border: none; border-radius: 14px;
            font-family: 'Fraunces', serif; font-size: 1.05em; font-weight: 600;
            letter-spacing: 0.3px; cursor: pointer;
            box-shadow: 0 12px 28px rgba(210,93,130,0.35);
            transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(210,93,130,0.42); filter: brightness(1.04); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { background: #EAD5DB; color: #B99AA6; cursor: not-allowed; box-shadow: none; }
        .btn .btn-label { position: relative; z-index: 2; }
        .btn .sheen {
            position: absolute; top: 0; left: -60%; width: 40%; height: 100%; z-index: 1;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,0.6), transparent);
            transform: skewX(-20deg);
        }

        .message {
            padding: 12px 16px; border-radius: 12px; margin-top: 16px;
            font-weight: 500; font-size: 0.85em;
            display: none; align-items: center; gap: 10px;
            border: 1px solid transparent;
        }
        .message.success { background: rgba(63,168,139,0.1);  color: var(--ok);   border-color: rgba(63,168,139,0.3); display: flex; }
        .message.error   { background: rgba(217,80,110,0.1);  color: var(--err);  border-color: rgba(217,80,110,0.3); display: flex; }
        .message.warning { background: rgba(217,154,60,0.1);  color: var(--warn); border-color: rgba(217,154,60,0.3); display: flex; }
        .message .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

        /* Geo overlays */
        #geoChecking, #geoOverlay {
            position: absolute; inset: 0; z-index: 10;
            background: rgba(255,247,243,0.97); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 30px;
        }
        #geoChecking { gap: 18px; color: var(--ink-soft); font-size: 0.9em; }
        .heart-loader {
            width: 44px; height: 44px; position: relative;
            transform: rotate(-45deg); animation: beat 1s ease-in-out infinite;
        }
        .heart-loader::before, .heart-loader::after {
            content: ''; position: absolute; width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--rose), var(--gold));
        }
        .heart-loader::before { top: -22px; left: 0; }
        .heart-loader::after  { top: 0; left: 22px; }
        .heart-loader .sq { position: absolute; inset: 0; background: linear-gradient(135deg, var(--rose), var(--gold)); }
        @keyframes beat { 0%,100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-45deg) scale(1.15); } }

        #geoOverlay .geo-icon {
            width: 60px; height: 60px; border-radius: 18px; margin-bottom: 18px;
            background: rgba(217,80,110,0.1); border: 1px solid rgba(217,80,110,0.28);
            display: grid; place-items: center; font-size: 1.7em;
        }
        #geoOverlay h3 { font-family: 'Fraunces', serif; font-size: 1.3em; color: var(--err); margin-bottom: 10px; font-weight: 700; }
        #geoOverlay p { color: var(--ink-soft); font-size: 0.88em; line-height: 1.6; margin-bottom: 20px; max-width: 300px; }
        #geoOverlay .lab-badge {
            background: #fff; border: 1px solid var(--line);
            color: var(--ink); padding: 10px 20px; border-radius: 30px;
            font-size: 0.82em; font-weight: 500; box-shadow: 0 6px 16px rgba(210,93,130,0.14);
        }

        @media (max-width: 820px) {
            body { overflow-y: auto; padding: 24px 0; }
            .login-container { flex-direction: column; width: 92%; height: auto; }
            .image-panel { min-height: 230px; }
            .login-panel { padding: 36px 26px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .login-container { opacity: 1 !important; }
        }
    </style>
</head>
<body>

<div class="backdrop"></div>
<div class="petal" style="top:12%; left:10%;"></div>
<div class="petal" style="top:22%; left:82%;"></div>
<div class="petal" style="top:68%; left:16%;"></div>
<div class="petal" style="top:78%; left:88%;"></div>
<div class="petal" style="top:44%; left:48%;"></div>

<div class="login-container" id="card">

    <div class="image-panel">
        <video id="vid-idle"    src="1026.mp4"    autoplay loop muted playsinline preload="auto"></video>
        <video id="vid-correct" src="correct.mp4"         loop muted playsinline preload="auto" style="opacity:0"></video>
        <video id="vid-wrong"   src="wrong.mp4"           loop muted playsinline preload="auto" style="opacity:0"></video>
        <div class="panel-veil"></div>
        <div class="panel-caption">
            <p>Secure access to your AWS console-Girls 1.</p>
        </div>
    </div>

    <div class="login-panel">

        <div id="geoChecking">
            <div class="heart-loader"><div class="sq"></div></div>
            <span>Verifying your location…</span>
        </div>

        <div id="geoOverlay" style="display:none;">
            <div class="geo-icon">🔒</div>
            <h3>Access restricted</h3>
            <p>This portal can only be accessed from the Veera Cloud Lab. Please visit the lab and try again.</p>
            <span class="lab-badge">📍 Visit the lab to sign in</span>
        </div>

        <div class="form-body" id="loginForm">
            <div class="flourish anim"><span class="line"></span><span class="dot"></span><span>Girls Portal</span></div>
            <h2 class="anim">Welcome back</h2>
            <p class="subtitle anim">Sign in to your account to continue.</p>

            <div class="input-group anim">
                <label for="loginEmail">Email address</label>
                <div class="input-shell">
                    <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="username" required />
                </div>
            </div>

            <div class="input-group anim">
                <label for="loginPassword">Password</label>
                <div class="input-shell">
                    <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required />
                </div>
            </div>

            <button class="btn anim" id="loginBtn" onclick="window.login()">

                <span class="btn-label">Sign in</span>
            </button>

            <div id="loginMsg" class="message"></div>
        </div>

    </div>
</div>

<script>
(function () {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Drifting petals */
    if (!reduce) {
        document.querySelectorAll('.petal').forEach((p, i) => {
            gsap.to(p, { y: '+=26', x: '+=18', rotation: 40, duration: 5 + i, yoyo: true, repeat: -1, ease: 'sine.inOut', delay: i * 0.4 });
        });
    }

    window.addEventListener('load', () => {
        if (reduce) { document.getElementById('card').style.opacity = 1; return; }
        const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
        tl.to('#card', { opacity: 1, y: 0, duration: 0.7 })
          .from('.anim', { y: 16, opacity: 0, duration: 0.55, stagger: 0.08 }, '-=0.4')
          .from('.panel-caption', { y: 16, opacity: 0, duration: 0.55 }, '-=0.5');
    });

    document.querySelectorAll('.input-group input').forEach(inp => {
        const shell = inp.closest('.input-shell');
        inp.addEventListener('focus', () => shell.classList.add('focused'));
        inp.addEventListener('blur',  () => shell.classList.remove('focused'));
    });

    const btn = document.getElementById('loginBtn');
    btn.addEventListener('mouseenter', () => {
        if (reduce || btn.disabled) return;
        anime({ targets: '#loginBtn .sheen', left: ['-60%', '160%'], duration: 650, easing: 'easeInOutQuad' });
    });

    window._fx = {
        shake() { if (!reduce) anime({ targets: '#card', translateX: [0, -8, 7, -5, 3, 0], duration: 420, easing: 'easeInOutSine' }); },
        success() { if (!reduce) anime({ targets: '#loginBtn', scale: [1, 1.02, 1], duration: 450, easing: 'easeOutQuad' }); },
        msg(el) { if (reduce) { el.style.opacity = 1; return; } anime.remove(el); anime({ targets: el, opacity: [0,1], translateY: [-6,0], duration: 320, easing: 'easeOutQuad' }); },
        deny() { if (!reduce) anime({ targets: '#geoOverlay .geo-icon, #geoOverlay h3, #geoOverlay p, #geoOverlay .lab-badge', translateY: [12,0], opacity: [0,1], delay: anime.stagger(70), duration: 450, easing: 'easeOutQuad' }); }
    };
})();
</script>

<script>
(function() {
    var LAT = 17.43827, LNG = 78.45258, MAX_DIST_M = 500;
    function haversine(lat1,lon1,lat2,lon2) {
        var R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
        var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
        return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    function allow() {
        document.getElementById('geoChecking').style.display='none';
        document.getElementById('geoOverlay').style.display='none';
    }
    function deny() {
        document.getElementById('geoChecking').style.display='none';
        document.getElementById('geoOverlay').style.display='flex';
        if (window._fx) window._fx.deny();
        ['loginEmail','loginPassword','loginBtn'].forEach(function(id){
            var el=document.getElementById(id); if(el) el.disabled=true;
        });
    }
    if (!navigator.geolocation) { deny(); return; }
    navigator.geolocation.getCurrentPosition(
        function(pos) {
            haversine(pos.coords.latitude,pos.coords.longitude,LAT,LNG)<=MAX_DIST_M ? allow() : deny();
        },
        function() { deny(); },
        { timeout:10000, maximumAge:60000 }
    );
})();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCnuw9gryQYmk3SXVyJyw9piH5VpuapDj4",
        authDomain: "veera730pmoffline.firebaseapp.com",
        projectId: "veera730pmoffline",
        storageBucket: "veera730pmoffline.firebasestorage.app",
        messagingSenderId: "302438121216",
        appId: "1:302438121216:web:bb010db38d4225d656bde5",
        measurementId: "G-624V2DN4F8"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    const vidIdle    = document.getElementById('vid-idle');
    const vidCorrect = document.getElementById('vid-correct');
    const vidWrong   = document.getElementById('vid-wrong');

    [vidCorrect, vidWrong].forEach(v => {
        v.load();
        const unlock = () => { v.play().then(() => v.pause()).catch(() => {}); v.removeEventListener('canplaythrough', unlock); };
        v.addEventListener('canplaythrough', unlock);
    });

    let _activeVid = vidIdle;
    function updateVideo(type) {
        const next = type === 'correct' ? vidCorrect : vidWrong;
        if (next === _activeVid) return;
        next.currentTime = 0;
        next.play().catch(() => {});
        next.style.opacity = '1';
        _activeVid.style.opacity = '0';
        _activeVid = next;
    }

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.innerHTML = '<span class="dot"></span><span>' + text + '</span>';
        el.className = 'message ' + type;
        if (window._fx) window._fx.msg(el);
    }
    function clearMsg(id) {
        const el = document.getElementById(id);
        el.innerHTML = '';
        el.className = 'message';
    }

    window.login = async () => {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn      = document.getElementById('loginBtn');
        const label    = btn.querySelector('.btn-label');

        if (!email || !password) {
            showMsg('loginMsg', 'Please enter both email and password.', 'error');
            if (window._fx) window._fx.shake();
            return;
        }

        btn.disabled = true; label.textContent = 'Signing in…';
        clearMsg('loginMsg');

        try {
            await signInWithEmailAndPassword(auth, email, password);
            updateVideo('correct');
            if (window._fx) window._fx.success();
            showMsg('loginMsg', 'Login successful. Redirecting…', 'success');
            setTimeout(() => { window.location.href = 'veerawsg1.html'; }, 1000);
        } catch (err) {
            updateVideo('wrong');
            if (window._fx) window._fx.shake();
            const code = err.code || '';
            let msg = 'Veera Cloud: Authentication failed. Please try again.';
            if (code === 'auth/user-not-found' || code === 'auth/invalid-email') {
                msg = 'Veera Cloud: No account found with this email address.';
            } else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') {
                msg = 'Veera Cloud: Incorrect password. Please try again.';
            } else if (code === 'auth/too-many-requests') {
                msg = 'Veera Cloud: Too many failed attempts. Please wait and try again.';
            } else if (code === 'auth/user-disabled') {
                msg = 'Veera Cloud: This account has been disabled. Contact support.';
            } else if (code === 'auth/network-request-failed') {
                msg = 'Veera Cloud: Network error. Check your connection and retry.';
            }
            showMsg('loginMsg', msg, 'error');
            btn.disabled = false; label.textContent = 'Sign in';
        }
    };

    document.getElementById('loginPassword').addEventListener('keypress', e => { if (e.key === 'Enter') window.login(); });
</script>
